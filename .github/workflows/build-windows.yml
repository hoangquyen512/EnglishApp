name: Build Windows desktop

on:
  workflow_dispatch:
  push:
    branches: [main, feature/learning-program]
    paths:
      - ".github/workflows/build-windows.yml"
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "index.html"
      - "vite.config.*"
      - "tsconfig*.json"
      - "scripts/yume-desktop.ps1"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # version comes from package.json packageManager — do not also set `version:` here
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Bump nightly version
        shell: pwsh
        run: |
          $v = "0.1.$env:GITHUB_RUN_NUMBER"
          Write-Host "Nightly version $v"
          $utf8 = New-Object System.Text.UTF8Encoding $false
          function Write-NoBom([string]$path, [string]$text) {
            [System.IO.File]::WriteAllText((Join-Path $pwd $path), $text, $utf8)
          }
          $pkg = [System.IO.File]::ReadAllText((Join-Path $pwd "package.json"))
          $pkg = [regex]::Replace($pkg, '"version"\s*:\s*"[^"]+"', "`"version`": `"$v`"", 1)
          Write-NoBom "package.json" $pkg
          $conf = [System.IO.File]::ReadAllText((Join-Path $pwd "src-tauri/tauri.conf.json"))
          $conf = [regex]::Replace($conf, '"version"\s*:\s*"[^"]+"', "`"version`": `"$v`"", 1)
          Write-NoBom "src-tauri/tauri.conf.json" $conf
          echo "YUME_VERSION=$v" >> $env:GITHUB_ENV

      - name: Enable updater artifacts when signing key is present
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $utf8 = New-Object System.Text.UTF8Encoding $false
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Host "No TAURI_SIGNING_PRIVATE_KEY — building without updater signatures"
            echo "YUME_SIGNED=false" >> $env:GITHUB_ENV
          } else {
            $confPath = Join-Path $pwd "src-tauri/tauri.conf.json"
            $conf = [System.IO.File]::ReadAllText($confPath)
            $conf = $conf -replace '"createUpdaterArtifacts":\s*false', '"createUpdaterArtifacts": true'
            [System.IO.File]::WriteAllText($confPath, $conf, $utf8)
            echo "YUME_SIGNED=true" >> $env:GITHUB_ENV
            Write-Host "Signing key present — updater artifacts enabled"
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri Windows app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:YUME_SIGNED -ne 'true') {
            Remove-Item Env:\TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            Remove-Item Env:\TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
            Write-Host "Signing env cleared (unsigned nightly)"
          }
          $utf8 = New-Object System.Text.UTF8Encoding $false
          $confPath = Join-Path $pwd "src-tauri/tauri.conf.json"
          $conf = [System.IO.File]::ReadAllText($confPath)
          $conf = $conf -replace '"beforeBuildCommand"\s*:\s*"[^"]*"', '"beforeBuildCommand": ""'
          [System.IO.File]::WriteAllText($confPath, $conf, $utf8)
          node -e "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')); console.log('tauri.conf.json ok')"
          Write-Host "Starting pnpm tauri build..."
          cmd /c "pnpm tauri build > tauri-build.log 2>&1"
          $code = $LASTEXITCODE
          Write-Host "tauri build exit=$code"
          if (Test-Path tauri-build.log) {
            Write-Host "===== tauri-build.log ====="
            Get-Content tauri-build.log
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "```"
            Get-Content tauri-build.log | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "```"
            $tail = (Get-Content tauri-build.log -Tail 30) -join "`n"
            if ($code -ne 0) {
              Write-Host "::error::Tauri build failed:`n$tail"
            }
          }
          if ($code -ne 0) { exit $code }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: tauri-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stage release assets
        shell: pwsh
        run: |
          $stage = "release-assets"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $setup = Get-ChildItem $nsisDir -Filter "*.exe" | Where-Object { $_.Name -notlike "*.sig" } | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          Copy-Item $setup.FullName (Join-Path $stage "Yume-setup.exe")
          Copy-Item "src-tauri/target/release/yume.exe" (Join-Path $stage "yume.exe")

          $sig = Get-ChildItem $nsisDir -Filter "*.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) {
            Copy-Item $sig.FullName (Join-Path $stage "Yume-setup.exe.sig")
            $signature = (Get-Content $sig.FullName -Raw).Trim()
            $latest = [ordered]@{
              version = $env:YUME_VERSION
              notes = "Yume desktop nightly $($env:YUME_VERSION) (run $($env:GITHUB_RUN_NUMBER))"
              pub_date = (Get-Date).ToUniversalTime().ToString("o")
              platforms = [ordered]@{
                "windows-x86_64" = [ordered]@{
                  signature = $signature
                  url = "https://github.com/hoangquyen512/EnglishApp/releases/download/desktop-nightly/Yume-setup.exe"
                }
              }
            }
            ($latest | ConvertTo-Json -Depth 6) | Set-Content (Join-Path $stage "latest.json") -Encoding utf8
            Write-Host "Staged signed updater metadata"
          } else {
            Write-Host "No .sig — portable/installer only (in-app updater inactive until secret is set)"
          }
          Get-ChildItem $stage | Format-Table Name, Length

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: yume-windows-nsis
          path: release-assets/Yume-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: yume-windows-portable
          path: release-assets/yume.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish desktop-nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-nightly
          name: Yume Desktop Nightly
          prerelease: true
          make_latest: false
          body: |
            Rolling Windows desktop build `${{ env.YUME_VERSION }}`.

            **Quick launch (no admin):** run `scripts/Yume-Desktop.cmd` or download `yume.exe`.
          files: |
            release-assets/Yume-setup.exe
            release-assets/yume.exe
            release-assets/Yume-setup.exe.sig
            release-assets/latest.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
