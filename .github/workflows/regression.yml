name: Regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: Full suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Full-system regression
        run: bash scripts/run-regression.sh
