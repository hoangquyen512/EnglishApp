name: UI tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ui:
    name: Design tokens + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Token contracts + UI flows
        run: pnpm test
        env:
          CI: true
