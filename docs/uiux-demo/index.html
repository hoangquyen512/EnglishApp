<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vocab Pet — Mẫu pet</title>
  <base id="assetBase" href="./" />
  <script>
    (function () {
      var host = location.hostname;
      var local = host === "localhost" || host === "127.0.0.1" || location.protocol === "file:";
      if (!local) {
        document.getElementById("assetBase").href =
          "https://cdn.jsdelivr.net/gh/hoangquyen512/EnglishApp@cursor/vocab-pet-uiux-design-9e4c/docs/uiux-demo/";
      }
      if (/[?&]shot=1/.test(location.search)) document.documentElement.classList.add("shot");
    })();
  </script>
  <style>
    @font-face { font-family: "Be Vietnam Pro"; src: url("./fonts/BeVietnamPro-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Be Vietnam Pro"; src: url("./fonts/BeVietnamPro-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
    @font-face { font-family: "Be Vietnam Pro"; src: url("./fonts/BeVietnamPro-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "Fraunces"; src: url("./fonts/Fraunces.ttf") format("truetype"); font-weight: 600 700; font-display: swap; }

    :root {
      --stone-25: #faf6f1;
      --stone-50: #f4eee6;
      --stone-100: #e8dfd4;
      --stone-500: #5c524a;
      --stone-800: #3d322b;
      --stone-950: #1f1915;
      --terracotta-700: #c2410c;
      --terracotta-800: #9a3412;
      --leaf-700: #3f6212;
      --focus: #1d4ed8;
      --radius-md: 12px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Be Vietnam Pro", ui-sans-serif, system-ui, sans-serif;
      color: var(--stone-950);
      background:
        radial-gradient(900px 480px at 18% 0%, rgb(255 236 210 / 0.75), transparent 55%),
        linear-gradient(180deg, #e8dcc8 0%, #cfc0a8 100%);
    }
    html.shot .demo-bar { display: none !important; }

    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    .demo-bar {
      position: sticky; top: 0; z-index: 10;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      padding: 10px 16px;
      background: rgb(31 25 21 / 0.88); color: #faf6f1;
    }
    .demo-bar strong { font-size: 14px; }
    .demo-bar a { color: #ffedd5; font-size: 13px; }
    .demo-bar .hint { margin-left: auto; font-size: 12px; color: rgb(250 246 241 / 0.7); }

    .wrap {
      width: min(100% - 32px, 960px);
      margin: 32px auto 56px;
    }

    .hero {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      background: var(--stone-25);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 24px 64px rgb(31 25 21 / 0.16);
    }

    .habitat {
      position: relative;
      aspect-ratio: 1;
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 28%, rgb(234 88 12 / 0.14), transparent 58%),
        var(--stone-50);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .habitat.cool {
      background:
        radial-gradient(circle at 50% 28%, rgb(100 116 139 / 0.18), transparent 58%),
        #ece8e4;
    }
    .habitat img {
      width: 82%;
      height: 82%;
      object-fit: contain;
      animation: bob 2.4s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .habitat img { animation: none; }
    }
    .mood-chip {
      position: absolute; left: 14px; bottom: 14px;
      display: inline-flex; align-items: center; gap: 6px;
      background: #fff; border: 1px solid var(--stone-100);
      border-radius: 999px; padding: 4px 10px; font-size: 13px; color: var(--stone-800);
    }

    .copy h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: 32px; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 8px;
    }
    .copy .sub { margin: 0 0 20px; color: var(--stone-500); font-size: 16px; line-height: 1.5; }
    .eyebrow {
      font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--stone-500); margin: 0 0 8px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .chip {
      min-height: 40px; padding: 0 14px; border-radius: 999px;
      border: 1px solid var(--stone-100); background: #fff; color: var(--stone-950);
    }
    .chip[aria-pressed="true"] { background: var(--terracotta-700); color: #fff; border-color: var(--terracotta-700); }
    .lore { margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: var(--stone-800); }
    .meta { margin: 6px 0 0; font-size: 13px; color: var(--stone-500); }

    .board {
      margin-top: 20px;
      background: var(--stone-25);
      border-radius: 24px;
      padding: 20px 24px 24px;
      box-shadow: 0 16px 40px rgb(31 25 21 / 0.1);
    }
    .board h2 { font-size: 16px; margin: 0 0 12px; }
    .evo {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .tile {
      background: #fff;
      border: 1px solid var(--stone-100);
      border-radius: var(--radius-lg);
      padding: 12px;
      text-align: center;
    }
    .tile[aria-current="true"] { border-color: var(--terracotta-700); box-shadow: 0 0 0 2px rgb(194 65 12 / 0.2); }
    .tile img { width: 100%; aspect-ratio: 1; object-fit: contain; background: var(--stone-50); border-radius: 14px; }
    .tile b { display: block; margin-top: 8px; font-size: 14px; }
    .tile span { font-size: 12px; color: var(--stone-500); }

    .moods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
    @media (max-width: 800px) {
      .wrap { width: min(100% - 20px, 960px); margin: 16px auto 40px; }
      .hero { grid-template-columns: 1fr; padding: 16px; border-radius: 18px; }
      .habitat { max-width: 280px; margin: 0 auto; }
      .copy h1 { font-size: 26px; }
      .chip { min-height: 44px; }
      .moods, .evo { grid-template-columns: 1fr 1fr; }
      .demo-bar { position: static; }
    }
  </style>
</head>
<body>
  <nav class="demo-bar">
    <strong>Mẫu pet</strong>
    <a href="./app.html">Demo màn hình app (sau)</a>
    <span class="hint">3 loài · trứng → non → trưởng thành · 4 tâm trạng</span>
  </nav>

  <main class="wrap">
    <section class="hero">
      <div id="habitat" class="habitat"></div>
      <div class="copy">
        <h1>Người bạn đồng hành</h1>
        <p class="sub">Xem pet trước. Chưa chốt UI app — chỉ mẫu hình, tiến hóa và tâm trạng.</p>

        <p class="eyebrow">Loài</p>
        <div class="chips" id="species"></div>

        <p class="eyebrow">Tiến hóa</p>
        <div class="chips" id="stages"></div>

        <p class="eyebrow">Tâm trạng</p>
        <div class="chips" id="moods"></div>

        <p class="lore" id="lore"></p>
        <p class="meta" id="meta"></p>
      </div>
    </section>

    <section class="board">
      <h2>Hàng tiến hóa</h2>
      <div class="evo" id="evo"></div>
      <h2 style="margin-top:20px">Tâm trạng (dạng trưởng thành)</h2>
      <div class="moods" id="moodGrid"></div>
    </section>
  </main>

  <script>
    const SPECIES = {
      cat: { name: "Mèo", lore: "Bạn đồng hành lông mềm, thích ngồi cạnh bàn học." },
      fox: { name: "Cáo", lore: "Thông minh và tò mò — hay nghiêng đầu khi bạn sai." },
      dragon: { name: "Rồng", lore: "Quả trứng rồng nhỏ. Lớn chậm, nhớ dai." }
    };
    const STAGES = [
      { id: "egg", label: "Trứng", level: "Cấp 1" },
      { id: "young", label: "Non", level: "Cấp 3" },
      { id: "adult", label: "Trưởng thành", level: "Cấp 6" }
    ];
    const MOODS = [
      { id: "happy", label: "Vui" },
      { id: "neutral", label: "Bình thường" },
      { id: "sad", label: "Buồn" },
      { id: "hungry", label: "Đói" }
    ];

    const state = { species: "cat", stage: "adult", mood: "happy" };

    function sprite(species, stage, mood) {
      if (stage !== "adult") return `pets/${species}-${stage}.jpg`;
      if (mood === "happy") return `pets/${species}-adult.jpg`;
      if (mood === "neutral") {
        return species === "cat" ? "pets/cat-neutral.jpg" : `pets/${species}-adult.jpg`;
      }
      return `pets/${species}-${mood}.jpg`;
    }

    function chips(el, items, key, getId, getLabel) {
      el.innerHTML = items.map((item) => {
        const id = getId(item);
        return `<button type="button" class="chip" data-key="${key}" data-id="${id}" aria-pressed="${state[key] === id}">${getLabel(item)}</button>`;
      }).join("");
    }

    function render() {
      const cool = state.mood === "sad" || state.mood === "hungry";
      const src = sprite(state.species, state.stage, state.mood);
      const mood = MOODS.find((m) => m.id === state.mood);
      document.getElementById("habitat").className = "habitat" + (cool ? " cool" : "");
      document.getElementById("habitat").innerHTML =
        `<img src="${src}" alt="${SPECIES[state.species].name} ${mood.label}" />` +
        `<span class="mood-chip">${mood.label}</span>`;

      chips(document.getElementById("species"), Object.keys(SPECIES), "species", (id) => id, (id) => SPECIES[id].name);
      chips(document.getElementById("stages"), STAGES, "stage", (s) => s.id, (s) => s.label);
      chips(document.getElementById("moods"), MOODS, "mood", (m) => m.id, (m) => m.label);

      document.getElementById("lore").textContent = SPECIES[state.species].lore;
      const stage = STAGES.find((s) => s.id === state.stage);
      document.getElementById("meta").textContent =
        `${SPECIES[state.species].name} · ${stage.label} (${stage.level}) · ${mood.label}` +
        (state.stage !== "adult" && state.mood !== "happy" ? " — tâm trạng chỉ vẽ ở dạng trưởng thành" : "");

      document.getElementById("evo").innerHTML = STAGES.map((s) => `
        <button type="button" class="tile" data-key="stage" data-id="${s.id}" aria-current="${state.stage === s.id}">
          <img src="${sprite(state.species, s.id, "happy")}" alt="" />
          <b>${s.label}</b><span>${s.level}</span>
        </button>`).join("");

      document.getElementById("moodGrid").innerHTML = MOODS.map((m) => `
        <button type="button" class="tile" data-key="mood" data-id="${m.id}" aria-current="${state.mood === m.id}">
          <img src="${sprite(state.species, "adult", m.id)}" alt="" />
          <b>${m.label}</b>
        </button>`).join("");

      history.replaceState(null, "", `?species=${state.species}&stage=${state.stage}&mood=${state.mood}`);
    }

    document.body.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-key]");
      if (!btn) return;
      state[btn.dataset.key] = btn.dataset.id;
      render();
    });

    const q = new URLSearchParams(location.search);
    if (SPECIES[q.get("species")]) state.species = q.get("species");
    if (STAGES.some((s) => s.id === q.get("stage"))) state.stage = q.get("stage");
    if (MOODS.some((m) => m.id === q.get("mood"))) state.mood = q.get("mood");
    render();
  </script>
</body>
</html>
