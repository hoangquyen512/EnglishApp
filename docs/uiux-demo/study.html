<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#7ea8c9" />
  <title>Vocab Pet — Học từ vựng TOEIC</title>
  <base id="assetBase" href="./" />
  <script>
    (function () {
      var host = location.hostname;
      var local = host === "localhost" || host === "127.0.0.1" || location.protocol === "file:";
      var served = /githack|jsdelivr|rawgit/i.test(host);
      if (!local && !served) {
        document.getElementById("assetBase").href =
          "https://cdn.jsdelivr.net/gh/hoangquyen512/EnglishApp@cursor/toeic-flashcards-e7dc/docs/uiux-demo/";
      }
    })();
  </script>
  <style>
    @font-face { font-family: "Be Vietnam Pro"; src: url("./fonts/BeVietnamPro-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Be Vietnam Pro"; src: url("./fonts/BeVietnamPro-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
    @font-face { font-family: "Be Vietnam Pro"; src: url("./fonts/BeVietnamPro-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "Fraunces"; src: url("./fonts/Fraunces.ttf") format("truetype"); font-weight: 600 700; font-display: swap; }

    :root {
      --stone-25: #faf6f1; --stone-50: #f4eee6; --stone-100: #e8dfd4;
      --stone-500: #5c524a; --stone-800: #3d322b; --stone-950: #1f1915;
      --terracotta-700: #c2410c; --terracotta-800: #9a3412;
      --leaf-700: #3f6212; --leaf-50: #f7fee7;
      --rose-700: #be123c; --rose-50: #fff1f2;
      --focus: #1d4ed8;
      --radius-md: 12px; --radius-lg: 20px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Be Vietnam Pro", ui-sans-serif, system-ui, sans-serif;
      color: var(--stone-950);
      background: linear-gradient(180deg, #7ea8c9 0%, #c5d6b8 45%, #d8c4a0 100%);
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .tabular { font-variant-numeric: tabular-nums; }

    .stage {
      position: relative;
      min-height: 100dvh;
      padding: calc(12px + var(--safe-top)) 16px calc(16px + var(--safe-bot));
      display: flex; flex-direction: column; gap: 8px;
    }

    .floater {
      position: absolute; right: 8px; top: calc(8px + var(--safe-top));
      width: 100px; background: none; border: 0; padding: 0; z-index: 6;
      filter: drop-shadow(0 12px 18px rgb(31 25 21 / 0.3));
    }
    .floater img { width: 100%; height: auto; display: block; animation: bob 2.4s ease-in-out infinite; pointer-events: none; }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { .floater img { animation: none; } }

    .card {
      margin-top: 118px;
      flex: 1;
      background: var(--stone-25);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 64px rgb(31 25 21 / 0.2);
      padding: 14px 16px 16px;
      display: flex; flex-direction: column; gap: 10px;
      min-height: 0;
    }
    .meta-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--stone-500);
    }
    .art {
      background: var(--stone-50);
      border: 1px solid var(--stone-100);
    }
    .art img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      object-position: center;
    }
    .pos { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--stone-500); }
    .word-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .word { margin: 0; font-family: Fraunces, Georgia, serif; font-size: 32px; letter-spacing: -.02em; line-height: 1.15; }
    .ipa { margin: 2px 0 0; font-size: 16px; color: var(--stone-500); }
    .meaning { margin: 0; font-size: 18px; font-weight: 700; color: var(--terracotta-800); }
    .example { margin: 0; padding-left: 12px; border-left: 2px solid var(--terracotta-700); font-size: 15px; line-height: 1.45; }
    .example-vi { margin: 0; padding-left: 12px; font-size: 12px; color: var(--stone-500); }
    .icon-btn {
      width: 44px; height: 44px; border: 0; border-radius: 999px;
      background: var(--stone-50); color: var(--stone-800);
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .controls { display: flex; justify-content: center; gap: 12px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
    .btn {
      min-height: 44px; border-radius: var(--radius-md); border: 1px solid transparent;
      font-weight: 600; font-size: 16px;
    }
    .btn-primary { background: var(--terracotta-700); color: #fff; }
    .btn-primary:active { background: var(--terracotta-800); }
    .btn-ghost { background: #fff; border-color: var(--stone-100); color: var(--stone-950); }
    .toast {
      min-height: 20px; text-align: center; font-size: 14px; font-weight: 600; color: var(--leaf-700);
    }
    .hint { margin: 0; font-size: 13px; color: rgb(31 25 21 / 0.72); text-align: center; }

    @media (min-width: 640px) {
      .stage { max-width: 420px; margin: 0 auto; }
      .floater { width: 140px; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <button class="floater" id="petBtn" type="button" aria-label="Nghe phát âm">
      <img id="petImg" src="./pets/cat-adult.png" alt="" />
    </button>
    <p class="hint">Chạm pet hoặc loa để nghe · thẻ đổi mỗi 30 giây</p>
    <article class="card" id="card">
      <div class="meta-row">
        <span>Từ vựng</span>
      </div>
      <div class="art" id="art"></div>
      <p class="pos" id="pos"></p>
      <div class="word-row">
        <div>
          <h1 class="word" lang="en" id="word"></h1>
          <p class="ipa" lang="en" id="ipa"></p>
        </div>
        <button class="icon-btn" id="speakBtn" type="button" aria-label="Nghe phát âm">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path d="M4 10v4h4l5 4V6L8 10H4z" />
            <path d="M16 9c1.2 1 1.8 2.2 1.8 3s-.6 2-1.8 3M18.5 7c1.8 1.6 2.7 3.4 2.7 5s-.9 3.4-2.7 5" />
          </svg>
        </button>
      </div>
      <p class="meaning" id="meaning"></p>
      <p class="example" lang="en" id="example"></p>
      <p class="example-vi" id="exampleVi"></p>
      <div class="controls">
        <button class="icon-btn" id="prevBtn" type="button" aria-label="Thẻ trước">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 6l-8 6 8 6V6z"/><path d="M6 6v12" fill="none" stroke="currentColor" stroke-width="1.75"/></svg>
        </button>
        <button class="icon-btn" id="pauseBtn" type="button" aria-label="Tạm dừng">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="6" width="3.5" height="12" rx="1"/><rect x="13.5" y="6" width="3.5" height="12" rx="1"/></svg>
        </button>
        <button class="icon-btn" id="nextBtn" type="button" aria-label="Thẻ tiếp">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6l8 6-8 6V6z"/><path d="M18 6v12" fill="none" stroke="currentColor" stroke-width="1.75"/></svg>
        </button>
      </div>
      <p class="toast" id="toast" role="status"></p>
      <div class="actions">
        <button class="btn btn-ghost" id="unknownBtn" type="button">Chưa nhớ</button>
        <button class="btn btn-primary" id="knownBtn" type="button">Đã nhớ</button>
      </div>
    </article>
  </main>
  <script>
    var CARDS = [
      { word: "invoice", phonetic: "/ˈɪn.vɔɪs/", pos: "n.", meaning: "hóa đơn", example: "Please attach the invoice to your email.", exampleVi: "Vui lòng đính kèm hóa đơn vào email của bạn.", art: "invoice" },
      { word: "deadline", phonetic: "/ˈded.laɪn/", pos: "n.", meaning: "hạn chót", example: "The deadline for the report is next Monday.", exampleVi: "Hạn chót nộp báo cáo là thứ Hai tuần sau.", art: "deadline" },
      { word: "applicant", phonetic: "/ˈæp.lɪ.kənt/", pos: "n.", meaning: "ứng viên", example: "Each applicant must submit a résumé by Friday.", exampleVi: "Mỗi ứng viên phải nộp sơ yếu lý lịch trước thứ Sáu.", art: "applicant" },
      { word: "conference", phonetic: "/ˈkɑːn.fər.əns/", pos: "n.", meaning: "hội nghị", example: "She will speak at an international conference in May.", exampleVi: "Cô ấy sẽ phát biểu tại một hội nghị quốc tế vào tháng Năm.", art: "conference" },
      { word: "shipment", phonetic: "/ˈʃɪp.mənt/", pos: "n.", meaning: "lô hàng", example: "The shipment will arrive at the warehouse tomorrow.", exampleVi: "Lô hàng sẽ đến kho vào ngày mai.", art: "shipment" },
      { word: "budget", phonetic: "/ˈbʌdʒ.ɪt/", pos: "n.", meaning: "ngân sách", example: "We need to reduce the marketing budget this quarter.", exampleVi: "Chúng ta cần cắt giảm ngân sách marketing quý này.", art: "budget" },
      { word: "reservation", phonetic: "/ˌrez.ərˈveɪ.ʃn/", pos: "n.", meaning: "đặt chỗ", example: "I made a reservation at the hotel near headquarters.", exampleVi: "Tôi đã đặt phòng tại khách sạn gần trụ sở.", art: "reservation" },
      { word: "itinerary", phonetic: "/aɪˈtɪn.ə.rer.i/", pos: "n.", meaning: "lịch trình", example: "The travel itinerary includes two client meetings.", exampleVi: "Lịch trình chuyến đi gồm hai cuộc họp với khách hàng.", art: "itinerary" },
      { word: "complimentary", phonetic: "/ˌkɑːm.plɪˈmen.tər.i/", pos: "adj.", meaning: "miễn phí (tặng kèm)", example: "Guests receive a complimentary breakfast each morning.", exampleVi: "Khách được dùng bữa sáng miễn phí mỗi sáng.", art: "complimentary" },
      { word: "authorize", phonetic: "/ˈɔː.θə.raɪz/", pos: "v.", meaning: "ủy quyền / cho phép", example: "Only the director can authorize this payment.", exampleVi: "Chỉ giám đốc mới được ủy quyền khoản thanh toán này.", art: "authorize" }
    ];

    var index = 0, paused = false, started = Date.now(), pausedMs = 0, pausedAt = null, audioReady = false;
    var DURATION = 30000;

    function remaining() {
      var end = pausedAt || Date.now();
      return Math.max(0, DURATION - (end - started - pausedMs));
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }

    function unlockAudio() {
      audioReady = true;
      speak(CARDS[index].word);
    }

    function show(i, doSpeak) {
      index = (i + CARDS.length) % CARDS.length;
      var c = CARDS[index];
      document.getElementById("word").textContent = c.word;
      document.getElementById("ipa").textContent = c.phonetic;
      document.getElementById("pos").textContent = c.pos;
      document.getElementById("meaning").textContent = c.meaning;
      document.getElementById("example").textContent = c.example;
      document.getElementById("exampleVi").textContent = c.exampleVi;
      document.getElementById("art").innerHTML = '<img src="./arts/' + c.art + '.jpg" alt="' + c.meaning + '" />';
      started = Date.now(); pausedMs = 0; pausedAt = paused ? Date.now() : null;
      if (doSpeak && audioReady) speak(c.word);
    }

    function next(note) {
      if (note) {
        document.getElementById("toast").textContent = note;
        setTimeout(function () { document.getElementById("toast").textContent = ""; }, 1400);
      }
      show(index + 1, true);
    }

    document.getElementById("speakBtn").onclick = function () { audioReady = true; speak(CARDS[index].word); };
    document.getElementById("petBtn").onclick = function () { audioReady = true; speak(CARDS[index].word); };
    document.getElementById("nextBtn").onclick = function () { audioReady = true; next(); };
    document.getElementById("prevBtn").onclick = function () { audioReady = true; show(index - 1, true); };
    document.getElementById("knownBtn").onclick = function () { audioReady = true; next("Pet vui lên · +5 XP"); };
    document.getElementById("unknownBtn").onclick = function () { audioReady = true; next("Sẽ ôn lại từ này"); };
    var PAUSE_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="6" width="3.5" height="12" rx="1"/><rect x="13.5" y="6" width="3.5" height="12" rx="1"/></svg>';
    var PLAY_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 6v12l10-6-10-6z"/></svg>';

    document.getElementById("pauseBtn").onclick = function () {
      paused = !paused;
      if (paused) pausedAt = Date.now();
      else { pausedMs += Date.now() - pausedAt; pausedAt = null; }
      this.innerHTML = paused ? PLAY_ICON : PAUSE_ICON;
      this.setAttribute("aria-label", paused ? "Tiếp tục" : "Tạm dừng");
    };

    document.body.addEventListener("touchstart", function () { if (!audioReady) unlockAudio(); }, { once: true });

    var touchX = null;
    document.getElementById("card").addEventListener("touchstart", function (e) { touchX = e.changedTouches[0].clientX; }, { passive: true });
    document.getElementById("card").addEventListener("touchend", function (e) {
      if (touchX == null) return;
      var dx = e.changedTouches[0].clientX - touchX;
      if (dx < -40) { audioReady = true; next(); }
      if (dx > 40) { audioReady = true; show(index - 1, true); }
      touchX = null;
    });

    setInterval(function () {
      if (remaining() <= 0 && !paused) next();
    }, 250);

    show(0, false);
  </script>
</body>
</html>
