<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vocab Pet — Popup / Nhà / Thẻ học</title>
  <base id="assetBase" href="./" />
  <script>
    (function () {
      var host = location.hostname;
      var local = host === "localhost" || host === "127.0.0.1" || location.protocol === "file:";
      if (!local) {
        document.getElementById("assetBase").href =
          "https://cdn.jsdelivr.net/gh/hoangquyen512/EnglishApp@cursor/vocab-pet-uiux-design-9e4c/docs/uiux-demo/";
      }
      if (/[?&]shot=1/.test(location.search)) document.documentElement.classList.add("shot");
    })();
  </script>
  <style>
    @font-face { font-family: "Be Vietnam Pro"; src: url("./fonts/BeVietnamPro-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Be Vietnam Pro"; src: url("./fonts/BeVietnamPro-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
    @font-face { font-family: "Be Vietnam Pro"; src: url("./fonts/BeVietnamPro-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "Fraunces"; src: url("./fonts/Fraunces.ttf") format("truetype"); font-weight: 600 700; font-display: swap; }

    :root {
      --stone-25: #faf6f1; --stone-50: #f4eee6; --stone-100: #e8dfd4;
      --stone-500: #5c524a; --stone-800: #3d322b; --stone-950: #1f1915;
      --terracotta-700: #c2410c; --terracotta-800: #9a3412;
      --leaf-700: #3f6212; --leaf-50: #f7fee7;
      --rose-700: #be123c; --rose-50: #fff1f2;
      --focus: #1d4ed8;
      --radius-md: 12px; --radius-lg: 20px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Be Vietnam Pro", ui-sans-serif, system-ui, sans-serif;
      color: var(--stone-950);
      background: linear-gradient(180deg, #7ea8c9 0%, #c5d6b8 45%, #d8c4a0 100%);
      min-height: 100vh;
    }
    html.shot .demo-bar { display: none !important; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .tabular { font-variant-numeric: tabular-nums; }

    .demo-bar {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 10px 16px; background: rgb(31 25 21 / 0.88); color: #faf6f1;
    }
    .demo-bar strong { font-size: 14px; margin-right: 6px; }
    .demo-bar a { color: #ffedd5; font-size: 13px; }
    .demo-bar button {
      border: 0; background: rgb(250 246 241 / 0.12); color: #faf6f1;
      padding: 6px 12px; border-radius: 999px; font-size: 13px;
    }
    .demo-bar button[aria-current="true"] { background: #c2410c; }

    .stage { position: relative; min-height: calc(100vh - 52px); padding: 24px 16px 72px; }

    .floater {
      position: absolute; right: 7%; bottom: 88px; width: 168px;
      background: none; border: 0; padding: 0; z-index: 5;
      filter: drop-shadow(0 12px 18px rgb(31 25 21 / 0.3));
    }
    .floater img { width: 100%; height: auto; display: block; animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { .floater img { animation: none; } }

    .tray {
      position: absolute; left: 16px; bottom: 16px; z-index: 8;
      display: flex; gap: 6px; padding: 6px; border-radius: 12px;
      background: rgb(31 25 21 / 0.55); color: #faf6f1; font-size: 13px;
    }
    .tray button { border: 0; background: transparent; color: inherit; padding: 8px 10px; border-radius: 8px; }
    .tray button:hover { background: rgb(255 255 255 / 0.12); }

    .notify {
      display: none; position: absolute; top: 24px; right: 24px; z-index: 9;
      width: 260px; background: #fff; border-radius: 14px; padding: 12px 14px;
      box-shadow: 0 16px 40px rgb(31 25 21 / 0.18);
    }
    .notify.show { display: block; }
    .notify .app { font-size: 12px; font-weight: 600; color: var(--stone-500); }
    .notify p { margin: 4px 0 0; font-size: 14px; }

    .win {
      background: var(--stone-25); border-radius: 12px;
      box-shadow: 0 24px 64px rgb(31 25 21 / 0.2); overflow: hidden;
    }
    .win.home { width: min(100%, 880px); min-height: 520px; margin: 0 auto; }
    .win.popup {
      position: absolute; right: calc(7% + 150px); bottom: 72px; z-index: 12;
      width: min(400px, calc(100% - 24px)); height: 500px;
    }
    .os-dots { display: flex; gap: 6px; padding: 10px 14px 0; }
    .os-dots span { width: 10px; height: 10px; border-radius: 50%; background: #e8dfd4; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 40px; min-width: 44px; padding: 0 16px;
      border-radius: var(--radius-md); border: 1px solid transparent;
    }
    .btn-primary { background: var(--terracotta-700); color: #fff; }
    .btn-primary:hover { background: var(--terracotta-800); }
    .btn-ghost { background: #fff; border-color: var(--stone-100); color: var(--stone-950); }
    .btn-ghost[aria-pressed="true"] { background: var(--terracotta-700); color: #fff; border-color: var(--terracotta-700); }
    .btn-wide { width: 100%; }
    .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--stone-500); margin: 0 0 8px; }
    .panel { background: #fff; border: 1px solid var(--stone-100); border-radius: var(--radius-lg); padding: 16px 20px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }

    .onboard { padding: 20px 24px 24px; }
    .onboard h1 { font-size: 28px; margin: 8px 0 4px; }
    .onboard .sub { margin: 0 0 20px; color: var(--stone-500); }
    .species-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .species { display: flex; flex-direction: column; gap: 10px; background: #fff; border: 1px solid var(--stone-100); border-radius: var(--radius-lg); padding: 14px; }
    .species img { height: 120px; width: 100%; object-fit: contain; }
    .species h2 { margin: 0; font-size: 18px; }
    .species p { margin: 0; flex: 1; font-size: 14px; color: var(--stone-500); line-height: 1.45; }

    .home { display: grid; grid-template-columns: 240px 1fr; gap: 16px; padding: 20px 24px 24px; }
    .home-pet { text-align: center; }
    .home-pet img { width: 140px; height: auto; filter: drop-shadow(0 8px 12px rgb(31 25 21 / 0.18)); }
    .home-pet h2 { margin: 8px 0 0; font-size: 20px; }
    .home-pet .meta { margin: 4px 0 0; font-size: 14px; color: var(--stone-500); }
    .hint-line { margin: 8px 0 0; font-size: 14px; color: var(--stone-800); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .stat { background: var(--stone-50); border-radius: 12px; padding: 8px; }
    .stat .k { font-size: 12px; color: var(--stone-500); }
    .stat .v { font-weight: 700; }
    .xp-track { height: 8px; background: var(--stone-50); border-radius: 999px; overflow: hidden; margin-top: 12px; }
    .xp-fill { height: 100%; width: 40%; background: var(--terracotta-700); }
    .xp-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--stone-500); margin-top: 6px; }
    .home-main { display: flex; flex-direction: column; gap: 16px; }
    .missions { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .mission { display: flex; justify-content: space-between; gap: 10px; background: var(--stone-50); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
    .mission .right { color: var(--stone-500); white-space: nowrap; }
    .interval { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; color: var(--stone-500); }
    .interval input { width: 64px; height: 36px; border: 1px solid var(--stone-100); border-radius: 8px; padding: 0 8px; }

    .popup-ui { height: 100%; display: flex; flex-direction: column; }
    .popup-head {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 4px 4px 12px; border-bottom: 1px solid var(--stone-100);
    }
    .popup-head .title { flex: 1; font-size: 14px; font-weight: 600; margin: 0; }
    .icon-btn { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 10px; color: var(--stone-800); }
    .popup-body { flex: 1; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    .witness { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--stone-500); }
    .witness img { width: 48px; height: 48px; object-fit: contain; }
    .prompt { margin: 0; font-family: Fraunces, Georgia, serif; font-size: 24px; letter-spacing: -.02em; }
    .prompt.phrase { font-size: 18px; }
    .example { margin: 0; font-size: 14px; color: var(--stone-500); }
    .choices { display: flex; flex-direction: column; gap: 8px; }
    .choice {
      width: 100%; min-height: 40px; text-align: left; padding: 8px 12px;
      background: #fff; border: 1px solid var(--stone-100); border-radius: var(--radius-md);
      display: flex; justify-content: space-between; align-items: center; font-size: 16px;
    }
    .choice.selected { border: 2px solid var(--terracotta-700); padding: 7px 11px; }
    .choice.correct { background: var(--leaf-50); border-color: var(--leaf-700); color: var(--leaf-700); }
    .choice.wrong { background: var(--rose-50); border-color: var(--rose-700); color: var(--rose-700); }
    .choice.dim { opacity: .45; }
    .banner { display: flex; gap: 8px; border-radius: var(--radius-md); padding: 10px 12px; font-size: 14px; }
    .banner.ok { background: var(--leaf-50); color: var(--leaf-700); }
    .banner.bad { background: var(--rose-50); color: var(--rose-700); }
    .banner strong { display: block; font-size: 16px; }
    .need { margin: 0; font-size: 14px; color: var(--rose-700); }
    .popup-actions { margin-top: auto; }

    @media (max-width: 820px) {
      .win.home { min-height: 0; }
      .home, .species-grid { grid-template-columns: 1fr; }
      .win.popup { position: relative; right: auto; bottom: auto; margin: 16px auto 0; height: auto; min-height: 480px; }
      .floater { width: 120px; right: 12px; bottom: 72px; }
    }
  </style>
</head>
<body>
  <nav class="demo-bar">
    <strong>Xung quanh pet</strong>
    <a href="./index.html">Mẫu pet</a>
    <button type="button" data-screen="desktop">Desktop</button>
    <button type="button" data-screen="onboard">Onboarding</button>
    <button type="button" data-screen="home">Nhà</button>
    <button type="button" data-screen="popup">Thẻ học</button>
    <button type="button" data-screen="correct">Đúng</button>
    <button type="button" data-screen="incorrect">Sai</button>
  </nav>

  <div class="stage">
    <div id="notify" class="notify" role="status">
      <div class="app">Vocab Pet</div>
      <p>Một thẻ nhỏ cho Mèo?</p>
    </div>
    <div id="main"></div>
    <button type="button" class="floater" id="floater" title="Bấm pet để học"></button>
    <nav class="tray" aria-label="Khay hệ thống">
      <button type="button" data-screen="home">Mở app</button>
      <button type="button" data-screen="popup">Học ngay</button>
      <button type="button" data-quit>Thoát</button>
    </nav>
  </div>

  <script>
    const PETS = {
      cat: { name: "Mèo", lore: "Bạn đồng hành lông mềm, thích ngồi cạnh bàn học." },
      fox: { name: "Cáo", lore: "Thông minh và tò mò — hay nghiêng đầu khi bạn sai." },
      dragon: { name: "Rồng", lore: "Quả trứng rồng nhỏ. Lớn chậm, nhớ dai." }
    };
    const CARDS = [
      { prompt: "time", example: "Take your time.", choices: ["thời gian", "người", "năm", "cách"], answer: 0 },
      { prompt: "Where is the nearest station?", example: null, phrase: true, choices: ["Nhà ga gần nhất ở đâu?", "Cho tôi xem thực đơn.", "Gia đình bạn thế nào?", "Gửi báo cáo giúp tôi."], answer: 0 }
    ];
    const state = {
      screen: "desktop",
      pet: "cat",
      mood: "happy",
      contentType: "vocabulary",
      topic: null,
      selected: null,
      result: null,
      needChoice: false
    };

    function sprite(kind, mood) {
      if (kind === "egg") return "pets/" + state.pet + "-egg.png";
      if (mood === "happy") return "pets/" + state.pet + "-adult.png";
      if (mood === "neutral") return state.pet === "cat" ? "pets/cat-neutral.png" : "pets/" + state.pet + "-adult.png";
      return "pets/" + state.pet + "-" + mood + ".png";
    }

    function renderFloater() {
      document.getElementById("floater").innerHTML =
        '<img src="' + sprite("adult", state.mood) + '" alt="' + PETS[state.pet].name + ' nổi trên màn hình" />';
    }

    function onboard() {
      return '<div class="win home"><div class="os-dots" aria-hidden="true"><span></span><span></span><span></span></div>' +
        '<div class="onboard"><h1>Chọn người bạn đồng hành</h1>' +
        '<p class="sub">Pet lớn lên mỗi khi bạn trả lời đúng. Sau đó pet sẽ nổi trên màn hình.</p>' +
        '<div class="species-grid">' +
        Object.keys(PETS).map(function (id) {
          return '<article class="species"><img src="pets/' + id + '-egg.png" alt="" />' +
            '<h2>' + PETS[id].name + '</h2><p>' + PETS[id].lore + '</p>' +
            '<button class="btn btn-primary btn-wide" type="button" data-adopt="' + id + '">Chọn pet này</button></article>';
        }).join("") +
        '</div></div></div>';
    }

    function home() {
      var hungry = state.mood === "hungry";
      var topics = state.contentType === "phrase"
        ? '<p class="eyebrow" style="margin-top:14px">Chủ đề</p><div class="chips">' +
          [["all","Tất cả chủ đề"],["travel","Du lịch"],["food","Ẩm thực"],["office","Công việc"],["family","Gia đình"]].map(function (t) {
            var on = (t[0] === "all" && !state.topic) || state.topic === t[0];
            return '<button type="button" class="btn btn-ghost" data-topic="' + t[0] + '" aria-pressed="' + on + '">' + t[1] + '</button>';
          }).join("") + "</div>"
        : "";
      return '<div class="win home"><div class="os-dots" aria-hidden="true"><span></span><span></span><span></span></div>' +
        '<div class="home"><aside class="panel home-pet">' +
        '<img src="' + sprite("adult", state.mood) + '" alt="" />' +
        '<h2>' + PETS[state.pet].name + '</h2>' +
        '<p class="meta">' + PETS[state.pet].name + ' · ' + (hungry ? "Đói" : "Vui") + '</p>' +
        (hungry ? '<p class="hint-line">Pet đang đói — một thẻ là đủ để pet vui lại.</p>' : "") +
        '<div class="stats"><div class="stat"><div class="k">Cấp</div><div class="v tabular">2</div></div>' +
        '<div class="stat"><div class="k">Streak</div><div class="v tabular">' + (hungry ? "0" : "3") + '</div></div></div>' +
        '<div class="xp-track" role="progressbar" aria-valuenow="20" aria-valuemax="50" aria-label="Kinh nghiệm tới cấp tiếp theo"><div class="xp-fill"></div></div>' +
        '<div class="xp-label"><span>XP</span><span class="tabular">20/50</span></div></aside>' +
        '<div class="home-main"><section class="panel"><p class="eyebrow">Chế độ học</p><div class="chips">' +
        '<button type="button" class="btn btn-ghost" data-mode="vocabulary" aria-pressed="' + (state.contentType === "vocabulary") + '">Từ vựng</button>' +
        '<button type="button" class="btn btn-ghost" data-mode="phrase" aria-pressed="' + (state.contentType === "phrase") + '">Câu giao tiếp</button></div>' +
        topics + '<div style="margin-top:16px"><button type="button" class="btn btn-primary" data-screen="popup">Học ngay</button></div></section>' +
        '<section class="panel"><p class="eyebrow">Nhiệm vụ hôm nay</p><ul class="missions">' +
        '<li class="mission"><span>Học từ/câu mới hôm nay</span><span class="right tabular">3/10 · +15 XP</span></li>' +
        '<li class="mission"><span>Ôn lại từ/câu đã trả lời sai</span><span class="right tabular">0/5 · +10 XP</span></li>' +
        '<li class="mission"><span>Luyện chủ đề Du lịch</span><span class="right tabular">1/3 · +12 XP</span></li></ul>' +
        '<div class="interval"><label for="interval">Nhắc học mỗi (phút)</label>' +
        '<input id="interval" class="tabular" type="number" min="1" max="180" value="2" /></div></section></div></div></div>';
    }

    function popup() {
      var card = CARDS[state.contentType === "phrase" ? 1 : 0];
      var locked = state.result !== null;
      var choices = card.choices.map(function (text, i) {
        var cls = "choice";
        if (!locked && state.selected === i) cls += " selected";
        if (locked && i === card.answer) cls += " correct";
        if (locked && state.selected === i && i !== card.answer) cls += " wrong";
        if (locked && i !== card.answer && i !== state.selected) cls += " dim";
        return '<button type="button" class="' + cls + '" data-choice="' + i + '"' + (locked ? " disabled" : "") + "><span>" + text + "</span></button>";
      }).join("");
      var banner = "";
      if (state.result === "ok") banner = '<div class="banner ok" role="status"><div><strong>Đúng rồi!</strong>Pet vui lên · +5 XP</div></div>';
      if (state.result === "bad") banner = '<div class="banner bad" role="status"><div><strong>Chưa đúng</strong>Đáp án đúng được tô xanh bên dưới.</div></div>';
      var cta = locked
        ? '<button type="button" class="btn btn-primary btn-wide" data-next>Thẻ tiếp theo</button>'
        : '<button type="button" class="btn btn-primary btn-wide" data-submit>Submit</button>';
      return '<div class="win popup"><div class="popup-ui"><header class="popup-head">' +
        '<h1 class="title">Học ngay</h1>' +
        '<button type="button" class="icon-btn" data-close title="Đóng" aria-label="Đóng cửa sổ học">✕</button></header>' +
        '<div class="popup-body"><div class="witness"><img src="' + sprite("adult", state.mood) + '" alt="" /><span>' + PETS[state.pet].name + " · Vui</span></div>" +
        '<h2 class="prompt' + (card.phrase ? " phrase" : "") + '" lang="en">' + card.prompt + "</h2>" +
        (card.example && !state.result ? '<p class="example" lang="en">' + card.example + "</p>" : "") +
        banner + '<div class="choices">' + choices + "</div>" +
        (state.needChoice ? '<p class="need">Hãy chọn một đáp án.</p>' : "") +
        '<div class="popup-actions">' + cta + "</div></div></div></div>";
    }

    function go(screen) {
      state.screen = screen;
      if (screen === "popup") { state.selected = null; state.result = null; state.needChoice = false; state.mood = "happy"; }
      if (screen === "correct") { state.selected = 0; state.result = "ok"; state.contentType = "vocabulary"; state.mood = "happy"; }
      if (screen === "incorrect") { state.selected = 1; state.result = "bad"; state.contentType = "vocabulary"; }
      if (screen === "hungry") { state.mood = "hungry"; state.screen = "home"; }
      render();
    }

    function render() {
      var main = document.getElementById("main");
      document.getElementById("notify").classList.toggle("show", state.mood === "hungry" && state.screen === "home");
      if (state.screen === "onboard") main.innerHTML = onboard();
      else if (state.screen === "home") main.innerHTML = home();
      else if (state.screen === "desktop") main.innerHTML = "";
      else main.innerHTML = popup();
      renderFloater();
      document.querySelectorAll(".demo-bar [data-screen]").forEach(function (btn) {
        btn.setAttribute("aria-current", btn.dataset.screen === state.screen ? "true" : "false");
      });
      var q = "?screen=" + state.screen;
      history.replaceState(null, "", q);
    }

    document.querySelector(".demo-bar").addEventListener("click", function (e) {
      var b = e.target.closest("[data-screen]");
      if (b) go(b.dataset.screen);
    });
    document.querySelector(".stage").addEventListener("click", function (e) {
      var adopt = e.target.closest("[data-adopt]");
      if (adopt) { state.pet = adopt.dataset.adopt; state.mood = "happy"; go("home"); return; }
      var mode = e.target.closest("[data-mode]");
      if (mode) { state.contentType = mode.dataset.mode; if (state.contentType === "vocabulary") state.topic = null; render(); return; }
      var topic = e.target.closest("[data-topic]");
      if (topic) { state.topic = topic.dataset.topic === "all" ? null : topic.dataset.topic; render(); return; }
      var jump = e.target.closest("[data-screen]");
      if (jump && !e.target.closest(".demo-bar")) { go(jump.dataset.screen); return; }
      if (e.target.closest("#floater")) { go("popup"); return; }
      var choice = e.target.closest("[data-choice]");
      if (choice && state.result === null) { state.selected = Number(choice.dataset.choice); state.needChoice = false; render(); return; }
      if (e.target.closest("[data-submit]")) {
        if (state.selected === null) { state.needChoice = true; render(); return; }
        var card = CARDS[state.contentType === "phrase" ? 1 : 0];
        state.result = state.selected === card.answer ? "ok" : "bad";
        if (state.result === "ok") state.mood = "happy";
        render(); return;
      }
      if (e.target.closest("[data-next]")) {
        state.selected = null; state.result = null;
        state.contentType = state.contentType === "vocabulary" ? "phrase" : "vocabulary";
        render(); return;
      }
      if (e.target.closest("[data-close]") || e.target.closest("[data-quit]")) go("desktop");
    });
    document.addEventListener("keydown", function (e) {
      if (!document.querySelector(".popup-ui")) return;
      if (["1","2","3","4"].indexOf(e.key) >= 0 && state.result === null) {
        state.selected = Number(e.key) - 1; state.needChoice = false; render();
      } else if (e.key === "Enter") {
        if (state.result) { state.selected = null; state.result = null; state.contentType = state.contentType === "vocabulary" ? "phrase" : "vocabulary"; render(); }
        else if (state.selected === null) { state.needChoice = true; render(); }
        else {
          var card = CARDS[state.contentType === "phrase" ? 1 : 0];
          state.result = state.selected === card.answer ? "ok" : "bad";
          render();
        }
      } else if (e.key === "Escape") go("desktop");
    });

    var initial = new URLSearchParams(location.search).get("screen") || "desktop";
    if (initial === "hungry") { state.mood = "hungry"; initial = "home"; }
    go(["desktop","onboard","home","popup","correct","incorrect"].indexOf(initial) >= 0 ? initial : "desktop");
  </script>
</body>
</html>
