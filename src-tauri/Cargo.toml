[package]
name = "vocab-pet-app"
version = "0.1.0"
description = "Vocab Pet — daily English flashcards with a Tamagotchi-style pet"
authors = ["Vocab Pet"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "vocab_pet_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
