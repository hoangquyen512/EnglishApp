[package]
name = "yume"
version = "0.1.0"
description = "Yume — daily English flashcards with a Tamagotchi-style pet"
authors = ["Hoang Quyen"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "yume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
password-hash = "0.5"
rand = "0.8"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder"] }
